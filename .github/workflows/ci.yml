name: ci

on:
  workflow_dispatch:
  push:
    # Both keys are deliberate. GitHub skips an event for any ref category left
    # undefined, so `tags-ignore` alone would stop branch pushes from building
    # at all. `edge` is the rolling prerelease tag this workflow moves itself;
    # without the exclusion each master build would push a tag that started a
    # second, duplicate build.
    branches:
      - '**'
    tags-ignore:
      - edge
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Forks and unconfigured branches remain harmless. Release tags reject this
  # reserved value in release.yml rather than publishing with it.
  TAPKART_ORIGIN: ${{ vars.TAPKART_ORIGIN || 'https://tapkart.example' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: build the production PWA with the configured public origin
        run: VITE_TAPKART_ORIGIN="$TAPKART_ORIGIN" npm run build -w @tapkart/web
      - name: the public origin is embedded in the browser bundle
        run: |
          set -euo pipefail
          grep -R -F -l -- "$TAPKART_ORIGIN" apps/web/dist >/dev/null || {
            echo "the web build does not contain TAPKART_ORIGIN"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: build the web payload with the same origin as the manifest
        run: VITE_TAPKART_ORIGIN="$TAPKART_ORIGIN" npm run build -w @tapkart/web
      - name: generate the ignored native web payload in a clean checkout
        run: npm run sync -w @tapkart/android
      - name: both the web build and Capacitor copy contain the configured origin
        run: |
          set -euo pipefail
          for tree in apps/web/dist apps/android/app/src/main/assets/public; do
            test -d "$tree" || { echo "$tree does not exist"; exit 1; }
            grep -R -F -l -- "$TAPKART_ORIGIN" "$tree" >/dev/null || {
              echo "$tree does not contain TAPKART_ORIGIN"
              exit 1
            }
          done
      - name: the committed invite constants are freshly generated
        run: |
          node apps/android/scripts/write-invite-constants.mjs
          git diff --exit-code -- apps/android/gradle/invite-constants.properties
      - run: apps/android/gradlew -p apps/android :app:testDebugUnitTest
      - run: apps/android/gradlew -p apps/android :app:assembleDebug
      - run: node apps/android/scripts/assert-manifest.mjs debug
      - run: bash apps/android/scripts/assert-pins.sh
      - run: bash apps/android/scripts/assert-signing.sh
      # The debug APK, published so every master build has an installable
      # artifact. It is signed with Android's universal debug key, NOT the
      # release keystore: App Links will therefore NOT verify against a
      # deployed origin, and an invite tapped on a phone opens the browser
      # rather than the app. That is a property of the signing key, not a bug
      # to chase. The signed, verifying APK comes from release.yml on a `v*`
      # tag, and requires the owner's keystore secrets.
      - name: publish the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tapkart-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds web once, builds server once, then starts it.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v3
      - name: build the image for this runner architecture
        run: docker build -t tapkart:ci .
      - run: bash docker/assert-container.sh tapkart:ci

  edge-image:
    # `latest` is release-only. Master publishes `edge` and an immutable full
    # commit-SHA tag, after every gating job above has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [web, android, e2e, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/atvriders/tapkart:edge
            ghcr.io/atvriders/tapkart:sha-${{ github.sha }}
      - name: edge and its immutable SHA tag are multi-platform
        run: |
          set -euo pipefail
          for tag in edge "sha-${GITHUB_SHA}"; do
            docker buildx imagetools inspect "ghcr.io/atvriders/tapkart:$tag" | tee "/tmp/$tag.inspect"
            grep -q 'linux/amd64' "/tmp/$tag.inspect" || { echo "$tag: amd64 missing"; exit 1; }
            grep -q 'linux/arm64' "/tmp/$tag.inspect" || { echo "$tag: arm64 missing"; exit 1; }
          done

  edge-apk:
    # The installable APK, published where a phone can actually reach it.
    #
    # The `android` job already builds this APK and uploads it as a run
    # artifact, but an artifact needs a GitHub login, arrives as a ZIP, and
    # expires after ninety days -- three obstacles between a person and the
    # phone they mean to install it on. A prerelease asset is a direct `.apk`
    # at a URL that never changes and never expires.
    #
    # Gated behind the same jobs as the image: an APK is published only from a
    # commit whose tests, e2e lane, and container assertions all passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [web, android, e2e, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tapkart-debug-apk
          path: apk
      - name: move the edge tag to this commit
        run: |
          set -euo pipefail
          # The release is attached to the tag NAME, so moving the tag is what
          # keeps the release page honest about which commit the asset is from.
          # `tags-ignore` above is what stops this push starting another build.
          git tag -f edge "$GITHUB_SHA"
          git push -f origin refs/tags/edge
      - name: publish the rolling debug prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src="$(find apk -type f -name '*.apk' -print -quit)"
          test -n "$src" || { echo "the android job published no APK"; exit 1; }
          install -m 0644 "$src" "$RUNNER_TEMP/tapkart-debug.apk"

          {
            echo 'The current `master` build, as an installable APK.'
            echo
            echo '**This is a debug build.** It is signed with Android'"'"'s universal debug'
            echo 'key, not the release keystore, so **App Links do not verify**: a tapped'
            echo 'invite opens the browser instead of the app. NFC, QR, and room-code joins'
            echo 'all work. It is also built against this repository'"'"'s reserved example'
            echo 'origin, not a deployment.'
            echo
            echo 'The signed APK that routes invites into the app comes from a `v*` release.'
            echo
            echo 'This link always serves the newest green `master` build:'
            echo 'https://github.com/Atvriders/tapkart/releases/download/edge/tapkart-debug.apk'
            echo
            echo "Built from commit $GITHUB_SHA."
          } > "$RUNNER_TEMP/notes.md"

          gh release view edge >/dev/null 2>&1 ||
            gh release create edge --prerelease --title 'Edge (debug build)' \
              --notes-file "$RUNNER_TEMP/notes.md"
          gh release edit edge --prerelease --title 'Edge (debug build)' \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload edge "$RUNNER_TEMP/tapkart-debug.apk" --clobber
