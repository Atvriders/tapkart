<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <meta name="theme-color" content="#0B0D10" />
    <title>Tapkart</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        background: #0b0d12; color: #e8ecf5;
        font: 500 16px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
        /* Without this the browser claims every touchmove for scrolling and
           steering stops working the moment a thumb moves. */
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #tk-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #tk-root { position: fixed; inset: 0; pointer-events: none; }
      #tk-root > * { pointer-events: auto; }
      .tk-hidden { display: none !important; }
      /* Safe-area probe. The shell reads these four resolved paddings with a single
         getComputedStyle call, only when a resize/orientationchange/fullscreenchange
         marks them dirty, and feeds them to the pure layout as CSS px. The var() half
         is not decoration: inside the APK, Capacitor's SystemBars plugin injects
         --safe-area-inset-* onto the root element, and that is the reliable source
         there; env() is the reliable source in a browser. max() takes whichever
         actually reported a cutout. */
      .tk-insets {
        position: fixed; top: 0; left: 0; width: 0; height: 0;
        visibility: hidden; pointer-events: none;
        padding-top:    max(env(safe-area-inset-top, 0px),    var(--safe-area-inset-top, 0px));
        padding-right:  max(env(safe-area-inset-right, 0px),  var(--safe-area-inset-right, 0px));
        padding-bottom: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
        padding-left:   max(env(safe-area-inset-left, 0px),   var(--safe-area-inset-left, 0px));
      }
      .tk-screen {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; gap: 16px;
        background: rgba(11, 13, 18, 0.82); text-align: center;
        /* A menu screen is routinely TALLER than the viewport it lands in: at
           844x390 the lobby stacks title + error + room code + a row of eight
           characters + track select + settings + a QR + the player list + READY +
           the actions row, which is far past 390px. Centring content that overflows
           clips it SYMMETRICALLY, so START RACE ends up both invisible and
           unreachable — no scrollbar, no clue. Start at the top and scroll; centring
           comes back below once there is height worth centring in. */
        justify-content: flex-start;
        overflow-y: auto; overscroll-behavior: contain;
        /* html/body set `touch-action: none` so a steering thumb is never stolen by
           the scroller. That intersects down through descendants, so the scroll this
           rule just enabled would be finger-dead without re-granting one axis here.
           Menu screens are hidden during a race, so this cannot reach the controls. */
        touch-action: pan-y;
        padding:
          max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
      }
      @media (min-height: 560px) {
        .tk-screen { justify-content: center; }
      }
      .tk-screen h1 { margin: 0; font-size: clamp(22px, 6vmin, 44px); letter-spacing: 0.18em; }
      .tk-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      .tk-btn {
        /* Hit targets track the same short-edge scale the touch controls use:
           --tk-ui-scale is buttonPx/88, written once per layout change by the shell.
           clamp() keeps a 44px floor (the accessibility minimum) on a cover screen
           and stops a tablet growing thumb-sized menu buttons. */
        min-width: clamp(96px, 26vmin, 150px);
        min-height: clamp(44px, calc(46px * var(--tk-ui-scale, 1)), 64px);
        padding: 0 20px;
        border: 1px solid #47506a; border-radius: 12px;
        background: #171b25; color: inherit; font: inherit; letter-spacing: 0.08em;
      }
      .tk-btn.tk-on { background: #2b6cff; border-color: #2b6cff; }
      .tk-error { color: #ff8a8a; max-width: 32ch; }
      .tk-screen select, .tk-screen input {
        min-height: 48px; padding: 0 12px; border-radius: 10px;
        border: 1px solid #47506a; background: #171b25; color: inherit; font: inherit;
      }
      .tk-settings {
        border: 1px solid #47506a; border-radius: 12px;
        background: rgba(23, 27, 37, 0.96); padding: 10px 14px;
      }
      .tk-settings-toggle { min-height: 40px; }
      .tk-settings[data-expanded="true"] {
        position: absolute; z-index: 8;
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        max-height: calc(
          100% - max(12px, env(safe-area-inset-top)) - max(12px, env(safe-area-inset-bottom))
        );
        overflow: auto; padding: 14px;
      }
      .tk-settings[data-expanded="true"] > .tk-settings-toggle { margin-bottom: 12px; }
      .tk-settings-content > .tk-row + .tk-row { margin-top: 12px; }
      .tk-settings-fields label {
        display: flex; align-items: center; gap: 8px; white-space: nowrap;
      }
      .tk-settings input[type="text"] { min-height: 40px; }
      .tk-settings input[type="range"] { min-height: 32px; padding: 0; }
      .tk-settings-note { margin: 12px 0 0; color: #b8d2ff; }
      .tk-lobby-players { margin: 0; padding-left: 24px; text-align: left; }
      .tk-screen ol { text-align: left; font-size: clamp(15px, 3.2vmin, 20px); line-height: 1.8; }
      /* The invite QR sizes itself from the short edge, but a panel can still be
         narrower than the canvas it was handed; without this it is silently cropped
         by the panel's overflow and the code will not scan, with no error anywhere. */
      .tk-screen canvas { max-width: 100%; height: auto; }
      .tk-hud {
        /* targetSdk 36 forces edge-to-edge, so a fixed 16px put lap/position
           underneath the status bar and behind a display cutout in landscape-left. */
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        left: max(16px, env(safe-area-inset-left));
        display: flex; flex-direction: column;
        z-index: 2; gap: 4px; font-variant-numeric: tabular-nums;
        text-shadow: 0 2px 6px #000; pointer-events: none;
      }
      .tk-hud .tk-countdown {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        /* Two declarations on purpose: engines without dynamic viewport units keep
           the first, everything else takes the second. dvmin follows the retracting
           mobile toolbar, so 3-2-1 does not resize under the player mid-count. */
        font-size: 22vmin;
        font-size: 22dvmin;
        font-weight: 700; letter-spacing: 0.05em; pointer-events: none;
      }
      /* Replaces the retired "Rotate your device" overlay. Every orientation is now
         a real layout; the only refusal left is a viewport too small to lay out at
         all, and unlike that overlay this one swallows the input it covers. */
      .tk-blocked {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        z-index: 20; background: #0b0d12; font-size: 24px; letter-spacing: 0.1em;
        text-align: center; padding: 24px;
      }
      #tk-root > .tk-controls { pointer-events: none; }
      .tk-controls { position: absolute; inset: 0; z-index: 3; overflow: hidden; }
      .tk-steer-guide, .tk-control-affordance {
        position: absolute; pointer-events: none; color: rgba(255, 255, 255, 0.82);
        font-size: 12px; font-weight: 800; letter-spacing: 0.08em;
        text-shadow: 0 2px 5px #000;
      }
      .tk-steer-guide {
        display: flex; align-items: flex-end; justify-content: center; padding-bottom: 18px;
        border-right: 1px dashed rgba(255, 255, 255, 0.28);
        background: linear-gradient(to top, rgba(22, 108, 255, 0.12), transparent 40%);
      }
      .tk-control-affordance {
        display: grid; place-items: center; border: 2px solid rgba(255, 255, 255, 0.62);
        border-radius: 50%; background: rgba(11, 13, 18, 0.34);
        box-shadow: inset 0 0 24px rgba(43, 108, 255, 0.16), 0 3px 10px rgba(0, 0, 0, 0.35);
      }
      .tk-control-affordance[data-control="item"] {
        border-color: rgba(255, 210, 80, 0.72);
      }
      .tk-control-affordance[data-control="gas"] {
        border-color: rgba(92, 235, 143, 0.72);
      }
      .tk-control-affordance[data-control="brake"] {
        border-color: rgba(255, 122, 122, 0.72);
      }
      .tk-race-quit { position: absolute; pointer-events: auto; }
    </style>
  </head>
  <body>
    <canvas id="tk-canvas"></canvas>
    <div id="tk-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
